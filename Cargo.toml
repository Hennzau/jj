[package]
name = "jj"
version = "0.1.0"
edition = "2024"

[features]
git = [ "jj-cli/git", "jj-lib/git" ]

[dependencies]
jj-cli = { version = "0.40", default-features = false }
jj-lib = { version = "0.40", default-features = false }

clap = { version = "4.6", features = ["derive"] }
dunce = "1"
pollster = "0.4"
redb = "3"
thiserror = "2.0"
async-trait = "0.1"
prost = "0.14"
tokio = "1.50"
futures = "0.3"
hex = "0.4"
