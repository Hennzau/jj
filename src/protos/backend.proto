syntax = "proto3";

package backend;

message TreeValue {
  message File {
    bytes id = 1;
    bool executable = 2;
    bytes copy_id = 3;
  }

  oneof value {
    File file = 2;
    bytes symlink_id = 3;
    bytes tree_id = 4;
  }
}

message Tree {
  message Entry {
    string name = 1;
    TreeValue value = 2;
  }

  repeated Entry entries = 1;
}

message Commit {
  repeated bytes parents = 1;
  repeated bytes predecessors = 2;

  repeated bytes root_tree = 3;
  repeated string conflict_labels = 4;

  bytes change_id = 5;
  string description = 6;

  message Timestamp {
    int64 millis_since_epoch = 1;
    int32 tz_offset = 2;
  }

  message Signature {
    string name = 1;
    string email = 2;
    Timestamp timestamp = 3;
  }

  Signature author = 7;
  Signature committer = 8;
  optional bytes secure_sig = 9;
}
