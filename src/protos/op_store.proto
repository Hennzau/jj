syntax = "proto3";

package op_store;

message RefTarget {
  message Term {
    optional bytes value = 1;
  }
  repeated Term removes = 1;
  repeated Term adds = 2;
}

enum RemoteRefState {
  REMOTE_REF_STATE_NEW_UNSPECIFIED = 0;
  REMOTE_REF_STATE_TRACKED = 1;
}

message RemoteRef {
  RemoteRefState state = 1;
  RefTarget target = 2;
}

message RemoteView {
  map<string, RemoteRef> bookmarks = 1;
  map<string, RemoteRef> tags = 2;
}

message View {
  repeated bytes head_ids = 1;
  map<string, RefTarget> local_bookmarks = 2;
  map<string, RefTarget> local_tags = 3;
  map<string, RemoteView> remote_views = 4;
  map<string, bytes> wc_commit_ids = 5;
}

message Timestamp {
  int64 millis_since_epoch = 1;
  int32 tz_offset = 2;
}

message OperationMetadata {
  Timestamp start_time = 1;
  Timestamp end_time = 2;

  string description = 3;
  string hostname = 4;
  string username = 5;

  optional string workspace_name = 6;
  bool is_snapshot = 7;
  map<string, string> tags = 8;
}

message CommitPredecessors {
  bytes commit_id = 1;
  repeated bytes predecessor_ids = 2;
}

message Operation {
  bytes view_id = 1;
  repeated bytes parents = 2;
  OperationMetadata metadata = 3;
  repeated CommitPredecessors commit_predecessors = 4;
}
